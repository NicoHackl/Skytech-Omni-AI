# Bei Actions-Ausfall: scripts/ci-fallback.sh, siehe docs/git-workflow.md.
# Prüfungen für Skytech OmniAI.
#
# Jeder Push auf dev/dev durchläuft alle Prüfungen. Sind sie grün, übernimmt der
# Job "nach-dev-main" den Stand per Fast-Forward nach dev/main (einseitig, nie
# zurück). Von dev/main nach main geht ein Pull Request, den der User freigibt;
# erst dessen Merge löst das Release aus (.github/workflows/release.yaml).
# Ablauf und Regeln: docs/git-workflow.md, Begründung: D-025.
#
# Lokal laufen dieselben Prüfungen über scripts/check.sh (--docker für Bild und
# Smoke-Test). Actions sind auf Commit-SHAs festgenagelt; Dependabot hebt sie an.

name: CI

on:
  push:
    branches: [dev/dev]
  pull_request:
    branches: [dev/dev]
  workflow_dispatch:

permissions:
  contents: read

# Bei Pull Requests überholt ein neuerer Stand den laufenden Lauf. Auf
# dev/dev wird nie abgebrochen: eine laufende Übernahme nach dev/main darf nicht
# mittendrin enden.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 ist das Python im Add-on-Bild (Alpine 3.19), 3.14 das der Entwicklung.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            skytech_omniai/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r skytech_omniai/requirements.txt -r requirements-dev.txt

      - name: Linting
        run: ruff check --output-format=github .

      - name: Formatierung
        run: ruff format --check .

      - name: Tests
        run: >-
          pytest -q --cov=skytech_omniai --cov=scripts
          --cov-report=term:skip-covered --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"

  frontend:
    name: Oberfläche
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 20 entspricht dem nodejs aus Alpine 3.19, mit dem das Bild baut.
          node-version: "20"
          cache: npm
          cache-dependency-path: skytech_omniai/web/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci --prefix skytech_omniai/web

      # "build" führt zuerst tsc --noEmit aus — Typfehler brechen hier ab.
      - name: Typprüfung und Bau
        run: npm run build --prefix skytech_omniai/web

  addon-lint:
    name: Add-on, Workflows, Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add-on-Konfiguration (Home Assistant)
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "./skytech_omniai"

      - name: Workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: skytech_omniai/Dockerfile
          config: .hadolint.yaml

  docker:
    name: Image und Smoke-Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Dasselbe Basisimage, das der Supervisor aus build.yaml nimmt.
      - name: Basisimage aus build.yaml lesen
        id: base
        run: |
          build_from="$(sed -n 's/^  amd64: "\(.*\)"$/\1/p' skytech_omniai/build.yaml)"
          echo "build_from=${build_from}" >> "$GITHUB_OUTPUT"

      - name: Image bauen (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: skytech_omniai
          platforms: linux/amd64
          build-args: BUILD_FROM=${{ steps.base.outputs.build_from }}
          tags: skytech-omniai:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-Test
        run: scripts/smoke_test.sh skytech-omniai:ci

  security:
    name: Sicherheit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Die ganze Historie: ein einmal committetes Secret bleibt gültig, auch
          # wenn ein späterer Commit es wieder entfernt.
          fetch-depth: 0

      - name: Secrets in der Historie (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Python-Abhängigkeiten (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r skytech_omniai/requirements.txt -r requirements-dev.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # Nur was im Bild landet; Werkzeuge zum Bauen laufen nie beim Nutzer.
      - name: Abhängigkeiten der Oberfläche (npm audit)
        run: npm audit --prefix skytech_omniai/web --omit=dev --audit-level=high

  release-plan:
    name: Release-Vorschau
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ganze Historie samt origin/main: der Plan rechnet ab dem zuletzt
          # veröffentlichten Stand.
          fetch-depth: 0

      # Nur Warnungen: ein gepushter Commit lässt sich nicht mehr ändern. Lokal
      # verhindert der commit-msg-Hook, dass es so weit kommt.
      - name: Commit-Messages prüfen
        run: python3 scripts/commit_msg.py --range "$(git merge-base origin/main HEAD)..HEAD"

      # Zeigt Versionssprung und Changelog-Abschnitt des nächsten Releases.
      - name: Versionssprung und Changelog ermitteln
        run: |
          {
            echo "### Release-Vorschau"
            echo '```'
            python3 scripts/release.py plan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  nach-dev-main:
    name: Nach dev/main übernehmen
    needs: [python, frontend, addon-lint, docker, security, release-plan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: dev-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Nur Fast-Forward: Weicht dev/main von dev/dev ab, schlägt der Push fehl,
      # statt etwas zu überschreiben. Die Richtung ist einseitig — nie zurück.
      - name: Geprüften Stand nach dev/main übernehmen
        run: |
          git push origin "${GITHUB_SHA}:refs/heads/dev/main"
          echo "### dev/main steht auf ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

      # Öffnet den Pull Request nach main, falls es neue Commits gibt und noch keiner offen ist, und
      # weist ihn dem Repo-Besitzer zu. Es gibt immer höchstens einen offenen. Ein Pull Request, den
      # der Workflow-Token anlegt, startet keine weiteren Workflows (die Prüfungen gelten über den
      # gleichen Commit schon). Voraussetzung: Settings → Actions → General → "Allow GitHub Actions
      # to create and approve pull requests".
      - name: Pull Request nach main öffnen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          neu="$(git rev-list --count "origin/main..${GITHUB_SHA}")"
          offen="$(gh pr list --repo "$REPO" --head dev/main --base main --state open --json number --jq length)"
          if [ "$neu" -eq 0 ] || [ "$offen" -gt 0 ]; then
            echo "Kein neuer Pull Request nötig (neue Commits: ${neu}, offene Pull Requests: ${offen})."
            exit 0
          fi
          {
            echo "Automatisch geöffnet, nachdem alle Prüfungen auf dev/dev grün waren."
            echo
            echo "Neue Commits seit main:"
            git log --format='- %s' "origin/main..${GITHUB_SHA}"
            echo
            echo "**Bitte als Merge-Commit mergen** (nicht Squash, nicht Rebase)."
          } > "$RUNNER_TEMP/pr-body.md"
          if ! gh pr create --repo "$REPO" --base main --head dev/main --assignee "$OWNER" \
              --title "Freigabe: dev/main → main" --body-file "$RUNNER_TEMP/pr-body.md"; then
            echo "::warning::Pull Request konnte nicht angelegt werden. Einstellung prüfen: Settings → Actions → General → Allow GitHub Actions to create and approve pull requests. Sonst von Hand: gh pr create --base main --head dev/main --assignee ${OWNER}"
          fi
