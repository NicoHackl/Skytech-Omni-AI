# Prüfungen und Release für Skytech OmniAI.
#
# Jeder Push auf agent/main durchläuft alle Prüfungen. Sind sie grün und hat
# sich seit dem letzten Release etwas unter skytech_omniai/ geändert, legt der
# Job "release" auf main einen Release-Commit an: der geprüfte Stand, gestempelt
# mit Version und Changelog, dazu ein Tag. main ist der Stand, den Home
# Assistant installiert. agent/main bleibt unberührt — kein Bot-Commit, kein
# "git pull --rebase". Ablauf und Regeln: docs/git-workflow.md, Begründung: D-017.
#
# Lokal laufen dieselben Prüfungen über scripts/check.sh (--docker für Bild und
# Smoke-Test). Actions sind auf Commit-SHAs festgenagelt; Dependabot hebt sie an.

name: CI

on:
  push:
    branches: [agent/main]
  pull_request:
    branches: [agent/main]
  workflow_dispatch:

permissions:
  contents: read

# Bei Pull Requests überholt ein neuerer Stand den laufenden Lauf. Auf
# agent/main wird nie abgebrochen: ein laufender Release-Job darf nicht
# mittendrin enden. Er hat zusätzlich eine eigene Gruppe, damit nie zwei
# Releases gleichzeitig laufen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 ist das Python im Add-on-Bild (Alpine 3.19), 3.14 das der Entwicklung.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            skytech_omniai/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r skytech_omniai/requirements.txt -r requirements-dev.txt

      - name: Linting
        run: ruff check --output-format=github .

      - name: Formatierung
        run: ruff format --check .

      - name: Tests
        run: >-
          pytest -q --cov=skytech_omniai --cov=scripts
          --cov-report=term:skip-covered --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"

  frontend:
    name: Oberfläche
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 20 entspricht dem nodejs aus Alpine 3.19, mit dem das Bild baut.
          node-version: "20"
          cache: npm
          cache-dependency-path: skytech_omniai/web/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci --prefix skytech_omniai/web

      # "build" führt zuerst tsc --noEmit aus — Typfehler brechen hier ab.
      - name: Typprüfung und Bau
        run: npm run build --prefix skytech_omniai/web

  addon-lint:
    name: Add-on, Workflows, Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add-on-Konfiguration (Home Assistant)
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "./skytech_omniai"

      - name: Workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: skytech_omniai/Dockerfile
          config: .hadolint.yaml

  docker:
    name: Image und Smoke-Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Dasselbe Basisimage, das der Supervisor aus build.yaml nimmt.
      - name: Basisimage aus build.yaml lesen
        id: base
        run: |
          build_from="$(sed -n 's/^  amd64: "\(.*\)"$/\1/p' skytech_omniai/build.yaml)"
          echo "build_from=${build_from}" >> "$GITHUB_OUTPUT"

      - name: Image bauen (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: skytech_omniai
          platforms: linux/amd64
          build-args: BUILD_FROM=${{ steps.base.outputs.build_from }}
          tags: skytech-omniai:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-Test
        run: scripts/smoke_test.sh skytech-omniai:ci

  security:
    name: Sicherheit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Die ganze Historie: ein einmal committetes Secret bleibt gültig, auch
          # wenn ein späterer Commit es wieder entfernt.
          fetch-depth: 0

      - name: Secrets in der Historie (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Python-Abhängigkeiten (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r skytech_omniai/requirements.txt -r requirements-dev.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # Nur was im Bild landet; Werkzeuge zum Bauen laufen nie beim Nutzer.
      - name: Abhängigkeiten der Oberfläche (npm audit)
        run: npm audit --prefix skytech_omniai/web --omit=dev --audit-level=high

  release-plan:
    name: Release-Vorschau
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ganze Historie samt origin/main: der Plan rechnet ab dem zuletzt
          # veröffentlichten Stand.
          fetch-depth: 0

      # Nur Warnungen: ein gepushter Commit lässt sich nicht mehr ändern. Lokal
      # verhindert der commit-msg-Hook, dass es so weit kommt.
      - name: Commit-Messages prüfen
        run: python3 scripts/commit_msg.py --range "$(git merge-base origin/main HEAD)..HEAD"

      # Zeigt Versionssprung und Changelog-Abschnitt des nächsten Releases.
      - name: Versionssprung und Changelog ermitteln
        run: |
          {
            echo "### Release-Vorschau"
            echo '```'
            python3 scripts/release.py plan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release
    needs: [python, frontend, addon-lint, docker, security, release-plan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # Der Deploy-Key ist im Ruleset von main als einzige Ausnahme neben den
      # Admins eingetragen. Fehlt er, liest checkout mit GITHUB_TOKEN; scheitern
      # soll der Job dann erst, wenn wirklich etwas zu veröffentlichen ist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Genau der geprüfte Stand. Ist agent/main inzwischen weiter, kommt der
          # Rest mit dem Lauf des neueren Pushs.
          ref: ${{ github.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Version und Changelog in den Arbeitsbaum schreiben
        id: plan
        run: python3 scripts/release.py apply "$GITHUB_SHA"

      # Der Release-Commit wird direkt aus dem Baum gebaut statt gemergt — ein
      # Konflikt ist damit ausgeschlossen. Elternteile: das bisherige main und
      # der veröffentlichte Stand von agent/main. Über diesen zweiten Elternteil
      # findet der nächste Lauf heraus, was schon veröffentlicht ist.
      - name: Release-Commit und Tag auf main
        if: steps.plan.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          HAS_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_DEPLOY_KEY" != "true" ]; then
            echo "::error::Secret RELEASE_DEPLOY_KEY fehlt — ohne ihn darf der Job nicht nach main pushen (docs/git-workflow.md)."
            exit 1
          fi
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git add skytech_omniai/config.yaml skytech_omniai/CHANGELOG.md
          tree="$(git write-tree)"
          commit="$(git commit-tree "$tree" -p origin/main -p "$GITHUB_SHA" \
            -m "chore(release): Version ${VERSION}" \
            -m "Veröffentlicht aus agent/main ${GITHUB_SHA::7}.")"
          git tag -a "v${VERSION}" -m "Version ${VERSION}" "$commit"
          # Alles oder nichts. main nimmt nur einen Fast-Forward an; ist main
          # inzwischen weiter, scheitert der Push, und nichts ist verändert.
          git push --atomic origin "${commit}:refs/heads/main" "refs/tags/v${VERSION}"
          echo "### Version ${VERSION} veröffentlicht" >> "$GITHUB_STEP_SUMMARY"

      - name: Kein Release
        if: steps.plan.outputs.bump == 'none'
        run: echo "Seit dem letzten Release keine Änderung am Add-on — main bleibt, wie es ist." >> "$GITHUB_STEP_SUMMARY"
