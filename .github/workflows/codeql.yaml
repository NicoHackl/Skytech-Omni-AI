# Statische Sicherheitsanalyse von Python und TypeScript. Ergebnisse erscheinen
# im Reiter "Security" des Repositorys. Blockiert das Release nicht — ein Fund
# ist ein Anlass zur Prüfung, kein automatischer Stopp.

name: CodeQL

on:
  push:
    branches: [agent/main]
  pull_request:
    branches: [agent/main]
  schedule:
    # Montags 05:17 UTC: neue Abfragen finden auch Lücken in unverändertem Code.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
