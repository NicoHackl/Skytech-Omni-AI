name: "Skytech OmniAI"
# Die echte Version setzt der Release-Job beim Veröffentlichen auf main
# (scripts/release.py, D-025). Auf dev/dev steht hier immer "dev".
version: "1.1.0"
slug: "skytech_omniai"
description: "Modulare KI-Brücke für Home Assistant — Claude, ChatGPT und Google Gemini über das jeweilige Abo, dazu Gemini per API-Schlüssel"
url: "https://github.com/NicoHackl/Skytech-Omni-AI"
# Nur 64 Bit: die Codex-CLI wird ausschließlich für x86_64 und aarch64
# ausgeliefert. Begründung: D-014.
arch:
  - aarch64
  - amd64
init: false
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Schnittstelle von Skytech OmniAI"
# Die Seite „Einstellungen“ der Oberfläche liest und schreibt die eigenen
# Optionen über die Supervisor-API. Speichern braucht die Manager-Rolle (D-015).
hassio_api: true
hassio_role: manager
# Die Oberfläche ändert Zugänge und Werkzeugstufe — eine Aufgabe für
# Administratoren. Das ist die Vorgabe von panel_admin (true); der Linter von
# Home Assistant verlangt, Vorgaben nicht zu wiederholen. Nie auf false setzen.
# Die Oberfläche wird von Home Assistant eingebettet; sie läuft im selben
# Prozess wie die Schnittstelle und braucht deshalb keinen eigenen Port.
ingress: true
ingress_port: 8000
panel_icon: "mdi:robot"
panel_title: "OmniAI"
# Neustart bei Hängern: über den HEALTHCHECK im Dockerfile, nicht mehr über
# den veralteten Schlüssel "watchdog". /data ist immer eingebunden und braucht
# keinen Eintrag unter "map".
# Bequemer als hier lassen sich alle Optionen auf der Seite „Einstellungen“ in
# der Oberfläche (Seitenleiste „OmniAI“) setzen. Sie schreibt dieselben
# Optionen über die Supervisor-API; beide Wege zeigen immer denselben Stand.
options:
  provider: "claude_sub"
  # "auto" = kein Modell erzwingen, der jeweilige Provider entscheidet selbst.
  model: "auto"
  # Werkzeug-Freigabe der beiden Befehlszeilen. Ohne Freigabe kann die KI nichts
  # nachschlagen. "web" = Websuche und Seitenabruf, "full" = zusätzlich Shell-
  # und Dateizugriff im Container, "off" = keine Werkzeuge.
  tool_access: "web"
  claude_oauth_token: ""
  anthropic_api_key: ""
  codex_auth_json: ""
  openai_api_key: ""
  gemini_api_key: ""
  # Standardmodell für "gemini_agy" (Google AI Pro über die Antigravity-CLI), z. B.
  # "Gemini 4 Argon (High)" oder die Kurzform "flash-3.8". Leer = die CLI wählt
  # selbst. Die gültigen Bezeichnungen zeigt die Seite "Einstellungen" nach der
  # Anmeldung bei Google.
  gemini_agy_model: ""
  # Modell der Web-App; die Liste wird nach der Cookie-Anmeldung gelesen.
  gemini_web_model: ""
  # Token für die Schnittstelle v1 (Skytech X, D-019). Leer = /v1 lehnt alles ab.
  # Mindestens 32 zufällige Zeichen, z. B. openssl rand -base64 32.
  api_token: ""
schema:
  provider: "list(claude_sub|codex_sub|gemini|gemini_agy|gemini_web)"
  # Gemeinsame Liste für alle Provider: die ersten Einträge gehören zu
  # "claude_sub", die "gpt-*"-Einträge zu "codex_sub", die "gemini-*"-Einträge
  # zu "gemini". "gemini_agy" hat keine feste Liste (nur "auto"): seine Modelle
  # kennt die Google-Befehlszeile erst nach der Anmeldung. Pro Anfrage kann über
  # das Feld "model" im /ask-Rumpf weiterhin jede beliebige Modell-Kennung
  # gesetzt werden - diese Liste bestimmt nur den add-on-weiten Standard.
  model: "list(auto|sonnet|opus|haiku|gpt-5.6-sol|gpt-5.6-terra|gpt-5.6-luna|gpt-5.3-codex-spark|gemini-flash-latest|gemini-3.6-flash|gemini-3.5-flash|gemini-3.5-flash-lite|gemini-3.1-flash-lite|gemini-2.5-pro|gemini-2.5-flash|gemini-2.5-flash-lite)"
  tool_access: "list(off|web|full)"
  claude_oauth_token: "password?"
  anthropic_api_key: "password?"
  codex_auth_json: "password?"
  openai_api_key: "password?"
  gemini_api_key: "password?"
  gemini_agy_model: "str?"
  gemini_web_model: "str?"
  api_token: "password?"
